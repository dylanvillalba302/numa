<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Numa">
<meta name="theme-color" content="#000000">
<meta name="format-detection" content="telephone=no, email=no, address=no, date=no">
<meta name="description" content="Numa: registrá tus ingresos y gastos en segundos, aunque no tengas señal.">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<script>/* Ícono de la pantalla de inicio: claro u oscuro según el modo del celular (o el elegido en Ajustes) al momento de agregar la app */
try{var tm=localStorage.getItem('numa_tema'),cl=tm==='light'||(tm!=='dark'&&window.matchMedia&&matchMedia('(prefers-color-scheme: light)').matches);
if(cl)document.querySelector('link[rel="apple-touch-icon"]').setAttribute('href','apple-touch-icon-claro.png')}catch(e){}</script>
<title>Numa</title>
<script>try{var t=localStorage.getItem('numa_tema');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<style>
:root{
  --bg:#000000; --bg2:#0b0b0d; --card:#111114; --card2:#1a1a1e; --line:rgba(255,255,255,.07);
  --text:#eef2f8; --muted:#8b96a8; --faint:#5d6879;
  --ing:#34d399; --ing-bg:rgba(52,211,153,.12);
  --gas:#fb7185; --gas-bg:rgba(251,113,133,.12);
  --warn:#fbbf24; --accent:#60a5fa; --brand-glow:rgba(37,99,235,.22); --celeste:#38bdf8; --brand:#2563eb; --on-brand:#ffffff; --bar-muted:#2a3446; --on-ing:#05261a; --on-gas:#3a0611;
  --r:20px; --shadow:0 10px 30px rgba(0,0,0,.35);
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
  color-scheme:dark;
}
@media (prefers-color-scheme:light){
  :root:not([data-theme="dark"]){
    --bg:#f3f5f9; --bg2:#eceff5; --card:#ffffff; --card2:#f2f4f8; --line:rgba(15,23,42,.08);
    --text:#0f172a; --muted:#64748b; --faint:#94a3b8;
    --ing:#059669; --ing-bg:rgba(5,150,105,.10);
    --gas:#e11d48; --gas-bg:rgba(225,29,72,.09);
    --warn:#d97706; --accent:#2563eb; --celeste:#0284c7; --brand-glow:rgba(37,99,235,.12); --bar-muted:#cbd5e1; --on-ing:#ffffff; --on-gas:#ffffff; --shadow:0 10px 30px rgba(15,23,42,.10);
    color-scheme:light;
  }
}
:root[data-theme="light"]{
  --bg:#f3f5f9; --bg2:#eceff5; --card:#ffffff; --card2:#f2f4f8; --line:rgba(15,23,42,.08);
  --text:#0f172a; --muted:#64748b; --faint:#94a3b8;
  --ing:#059669; --ing-bg:rgba(5,150,105,.10);
  --gas:#e11d48; --gas-bg:rgba(225,29,72,.09);
  --warn:#d97706; --accent:#2563eb; --celeste:#0284c7; --brand-glow:rgba(37,99,235,.12); --bar-muted:#cbd5e1; --on-ing:#ffffff; --on-gas:#ffffff; --shadow:0 10px 30px rgba(15,23,42,.10);
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--text)}
body{font:15px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;min-height:100vh;overscroll-behavior-y:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input{font:inherit;color:inherit}
a{color:var(--accent)}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.01em}
#app{max-width:560px;margin:0 auto;padding-top:calc(var(--safe-t) + 10px);padding-bottom:calc(var(--safe-b) + 110px);
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}

/* Header */
.top{display:flex;align-items:center;gap:8px;padding:10px 0 18px}
.brand{display:flex;align-items:center;gap:9px;flex:1;min-width:0}
.mark{width:34px;height:34px;flex:none}
.mark .mk-n{fill:var(--text)}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.top .mark{width:40px;height:40px}
.brand h1{font-size:30px;line-height:1;margin:0 0 2px;font-weight:800;letter-spacing:-.045em;color:var(--text)}
.top .pill{height:28px;padding:0 10px;font-size:11.5px;background:transparent}
.top .icon-btn{width:34px;height:34px}
.pill{display:flex;align-items:center;gap:7px;height:32px;padding:0 12px;border-radius:99px;background:var(--card);
  border:1px solid var(--line);font-size:12.5px;font-weight:600;color:var(--muted);white-space:nowrap}
.pill .dot{width:8px;height:8px;border-radius:50%;background:var(--faint)}
.estado{width:30px;height:34px;display:grid;place-items:center;border-radius:12px}
.estado .dot{width:11px;height:11px;border-radius:50%;background:#38bdf8;box-shadow:0 0 0 4px rgba(56,189,248,.16)}
.estado.pend .dot{background:#f97316;box-shadow:0 0 0 4px rgba(249,115,22,.18)}
.estado.sync .dot{animation:pulse 1s infinite}
.icon-btn.menu svg{stroke:var(--text)}
.pill.ok .dot{background:var(--ing)} .pill.pend .dot{background:var(--warn)} .pill.err .dot{background:var(--gas)}
.pill.demo .dot{background:var(--accent)}
.pill.sync .dot{background:var(--accent);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.25}}
.icon-btn{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;background:var(--card);border:1px solid var(--line)}
.icon-btn svg{width:19px;height:19px;stroke:var(--muted)}

/* Month nav */
.month{display:flex;align-items:center;justify-content:space-between;margin:2px 0 12px}
.month b{font-size:15px;font-weight:650}
.month button{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;color:var(--muted)}
.month button:disabled{opacity:.25}
.month svg{width:18px;height:18px}

/* Cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:12px}
.card h3{margin:0 0 12px;font-size:12.5px;font-weight:650;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;display:flex;justify-content:space-between;align-items:center;gap:10px}
.hero{position:relative;overflow:hidden;background:
  radial-gradient(120% 140% at 100% 0%,var(--brand-glow),transparent 55%),var(--card)}
.hero .lbl{font-size:13px;color:var(--muted);font-weight:550}
.hero .big{font-size:38px;font-weight:750;letter-spacing:-.035em;margin:4px 0 16px;line-height:1.05}
.split{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mini{background:var(--card2);border-radius:14px;padding:11px 10px;min-width:0;display:flex;align-items:center;gap:9px}
.mini .mtx{min-width:0}
@media (max-width:370px){.mini .arrow{width:30px;height:30px}.mini{gap:7px;padding:10px 8px}}
.mini .mtx b{font-size:clamp(13px, 3.9vw, 17px);letter-spacing:-.02em;white-space:nowrap;overflow:visible}
.mini span{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);font-weight:600}
.mini b{display:block;font-size:17px;margin-top:3px;font-weight:700;overflow:hidden;text-overflow:ellipsis}
.arrow{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;flex:none}
.arrow.i{background:var(--ing-bg);color:var(--ing)} .arrow.g{background:var(--gas-bg);color:var(--gas)}
.ratio{margin-top:14px}
.ratio .bar{height:6px;border-radius:9px;background:var(--card2);overflow:hidden}
.ratio .bar i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,#2563eb,#7dd3fc)}
.ratio small{display:block;margin-top:7px;color:var(--muted);font-size:12.5px}
.pos{color:var(--ing)} .neg{color:var(--gas)}

.wallets{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.wallet{display:flex;gap:10px;align-items:center;min-width:0}
.wallet .ic{width:38px;height:38px;border-radius:12px;background:var(--card2);display:grid;place-items:center;font-size:18px;flex:none}
.wallet small{display:block;color:var(--muted);font-size:12px;font-weight:600}
.wallet b{font-size:16px;font-weight:700}

.seg{display:flex;background:var(--card2);border-radius:11px;padding:3px;gap:2px}
.seg button{flex:1;height:30px;border-radius:9px;font-size:13px;font-weight:650;color:var(--muted);transition:.15s}
.seg button.on{background:var(--card);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.2)}
.card h3 .seg{width:150px;text-transform:none;letter-spacing:0}
.card h3 .seg button{height:26px;font-size:12px}

.cat{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;padding:7px 0}
.cat .ic{width:34px;height:34px;border-radius:11px;background:var(--card2);display:grid;place-items:center;font-size:16px}
.cat .nm{display:flex;justify-content:space-between;font-size:14px;font-weight:600;margin-bottom:6px}
.cat .nm small{color:var(--muted);font-weight:550}
.cat .tr{height:5px;border-radius:9px;background:var(--card2);overflow:hidden}
.cat .tr i{display:block;height:100%;border-radius:9px}
.cat .amt{font-weight:700;font-size:14px;min-width:84px;text-align:right}
.empty{color:var(--muted);font-size:14px;text-align:center;padding:18px 6px}

.review .it{display:flex;align-items:center;gap:10px;padding:8px 0}
.review .it+.it{border-top:1px solid var(--line)}
.review .it span{flex:1;min-width:0;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.review .it button{font-size:13px;font-weight:650;padding:6px 10px;border-radius:9px;background:var(--card2)}

.day{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);font-weight:650;margin:16px 4px 6px}
.list{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.row{display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;padding:12px 14px}
.row+.row{border-top:1px solid var(--line)}
.row:active{background:var(--card2)}
.row .ic{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;font-size:18px;position:relative}
.row .ic.i{background:var(--ing-bg)} .row .ic.g{background:var(--gas-bg)}
.row .ic .p{position:absolute;right:-3px;bottom:-3px;width:16px;height:16px;border-radius:50%;background:var(--warn);
  border:2px solid var(--card);display:grid;place-items:center}
.row .ic .p svg{width:8px;height:8px;stroke:#111;stroke-width:3}
.row b{display:block;font-size:15px;font-weight:620;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row small{display:block;color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .amt{font-weight:700;font-size:15px}

/* Auth */
.auth{max-width:420px;margin:0 auto;padding-top:5vh}
.auth .mark{width:76px;height:76px;border-radius:22px;background:url(icon-512.png) center/cover;margin:0 0 22px;box-shadow:var(--shadow)}
.auth h2{font-size:28px;letter-spacing:-.02em;margin:0 0 6px}
.auth p.sub{color:var(--muted);margin:0 0 22px;font-size:15.5px}
.auth .field{margin-top:10px}
.auth .links{display:flex;justify-content:space-between;margin-top:16px;font-size:14px}
.auth .links button{color:var(--accent);font-weight:600}
.auth .legal{color:var(--faint);font-size:12.5px;margin-top:22px;line-height:1.5}
.feat{display:grid;gap:10px;margin:0 0 24px}
.feat div{display:flex;gap:10px;align-items:center;font-size:14.5px;color:var(--muted)}
.feat i{font-style:normal;width:30px;height:30px;border-radius:10px;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;flex:none}

/* Bottom actions */
.actions{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:12px max(16px, env(safe-area-inset-right, 0px)) calc(var(--safe-b) + 12px) max(16px, env(safe-area-inset-left, 0px));
  background:linear-gradient(to top,var(--bg) 62%,transparent)}
.actions .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.actions button{height:56px;border-radius:18px;font-size:16px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;
  box-shadow:var(--shadow);transition:transform .12s}
.actions button:active{transform:scale(.97)}
.actions .bi,.actions .bg{background:var(--card2);color:var(--text);border:1px solid var(--line)}
.actions svg{width:28px;height:28px;padding:6px;border-radius:9px;stroke-width:3}
.actions .bi svg{background:var(--ing-bg);color:var(--ing)}
.actions .bg svg{background:var(--gas-bg);color:var(--gas)}

.primary{width:100%;height:54px;border-radius:16px;font-weight:700;font-size:16px;background:var(--brand);color:var(--on-brand);margin-top:12px}
.primary:active{opacity:.85}
.primary:disabled{opacity:.5}
.ghost{width:100%;height:48px;border-radius:14px;font-weight:650;background:var(--card2);margin-top:8px}
.danger{width:100%;height:50px;border-radius:14px;font-weight:700;background:var(--gas-bg);color:var(--gas);margin-top:8px}
.danger.armed{background:var(--gas);color:var(--on-gas)}

/* Bottom sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .25s;z-index:40}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;max-width:560px;margin:0 auto;background:var(--bg2);
  border-radius:26px 26px 0 0;padding:8px max(18px, env(safe-area-inset-right, 0px)) calc(var(--safe-b) + 18px) max(18px, env(safe-area-inset-left, 0px));
  max-height:94vh;overflow-y:auto;transform:translateY(105%);transition:transform .32s cubic-bezier(.2,.9,.25,1);border-top:1px solid var(--line)}
body.sheet-open .sheet-bg{opacity:1;pointer-events:auto}
body.sheet-open .sheet{transform:none}
body.sheet-open{overflow:hidden}
.handle{width:38px;height:5px;border-radius:9px;background:var(--faint);opacity:.5;margin:2px auto 14px}
.sheet h2{font-size:20px;margin:0 0 14px;letter-spacing:-.02em}

.amount{display:flex;align-items:baseline;justify-content:center;gap:6px;margin:18px 0 6px}
.amount span{font-size:30px;font-weight:700;color:var(--muted)}
.amount input{width:2ch;min-width:1.2ch;max-width:290px;padding:0;border:0;outline:0;background:transparent;font-size:48px;font-weight:750;letter-spacing:-.035em;
  text-align:center;font-variant-numeric:tabular-nums}
.sheet[data-tipo=Ingreso] .amount input{color:var(--ing)}
.sheet[data-tipo=Gasto] .amount input{color:var(--gas)}
.amount input::placeholder{color:var(--faint)}
.hint{text-align:center;color:var(--muted);font-size:12.5px;min-height:18px;margin-bottom:12px}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.lbl2{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:18px 2px 8px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{display:flex;align-items:center;gap:6px;height:38px;padding:0 13px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-size:14px;font-weight:600}
.chip.on{border-color:transparent;background:var(--text);color:var(--bg)}
.seg.big button{height:42px;font-size:14px}
.field{width:100%;height:50px;border-radius:14px;border:1px solid var(--line);background:var(--card);padding:0 14px;outline:0;margin-top:8px;font-size:16px}
.field:focus{border-color:var(--accent)}
label.f{display:block;font-size:13px;font-weight:650;color:var(--muted);margin-top:12px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:11px 2px;font-size:14px}
.kv+.kv{border-top:1px solid var(--line)}
.kv span{color:var(--muted)}
.kv b{text-align:right;min-width:0;overflow-wrap:anywhere}
.msg{font-size:13.5px;margin:10px 2px 0;min-height:18px}
.badge{display:inline-flex;align-items:center;height:24px;padding:0 10px;border-radius:99px;font-size:12px;font-weight:700;background:var(--card2);color:var(--muted)}
.badge.prem{background:var(--ing-bg);color:var(--ing)}
.key{font:600 15px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.04em;background:var(--card2);border-radius:12px;padding:12px;overflow-wrap:anywhere;margin-top:8px}
.btnrow{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.detail{text-align:center;padding:6px 0 10px}
.detail .ic{width:64px;height:64px;border-radius:20px;display:grid;place-items:center;font-size:30px;margin:0 auto 10px}
.detail .ic.i{background:var(--ing-bg)} .detail .ic.g{background:var(--gas-bg)}
.detail .big{font-size:36px;font-weight:750;letter-spacing:-.03em}
.ver{color:var(--faint);font-size:12px;text-align:center;margin-top:16px}
.amt.aho,.rs .aho{color:var(--celeste)}
.rs .aho{display:inline-flex;align-items:center;gap:4px}.rs .aho .i{width:15px;height:15px}
.linkbtn{border:0;background:none;padding:0;color:var(--accent);font:inherit;font-weight:600;cursor:pointer}
.linkbtn.armed{color:var(--gas)}
/* iOS subraya solo los emails y teléfonos que detecta: se lo sacamos */
a[x-apple-data-detectors],.dhead a,.drawer a{color:inherit!important;text-decoration:none!important;font:inherit!important}
.mi,.mi *{text-decoration:none}
.ver .firma{color:var(--celeste);font-weight:700}

.toast{position:fixed;left:50%;top:calc(var(--safe-t) + 12px);transform:translate(-50%,calc(-100% - var(--safe-t) - 40px));visibility:hidden;z-index:60;background:var(--text);color:var(--bg);
  padding:11px 16px;border-radius:14px;font-weight:650;font-size:14px;box-shadow:var(--shadow);transition:transform .3s cubic-bezier(.2,.9,.25,1),visibility 0s .3s;
  max-width:calc(100% - 32px);text-align:center}
.toast.show{transform:translate(-50%,0);visibility:visible;transition:transform .3s cubic-bezier(.2,.9,.25,1),visibility 0s}




/* Menú lateral */
.menu-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .25s;z-index:44}
.drawer{position:fixed;top:0;bottom:0;right:0;z-index:45;width:min(320px,86vw);background:var(--bg2);border-left:1px solid var(--line);
  padding:calc(var(--safe-t) + 22px) max(18px, env(safe-area-inset-right, 0px)) calc(var(--safe-b) + 18px) 18px;
  transform:translateX(105%);transition:transform .3s cubic-bezier(.2,.9,.25,1);display:flex;flex-direction:column;gap:18px;overflow-y:auto}
body.menu-open .menu-bg{opacity:1;pointer-events:auto}
body.menu-open .drawer{transform:none}
body.menu-open{overflow:hidden}
.dhead{display:flex;align-items:center;gap:12px;padding:0 4px 4px}
.dhead .mark{width:38px;height:38px}
.dhead b{display:block;font-size:24px;font-weight:800;letter-spacing:-.04em;line-height:1}
.dhead small{display:block;color:var(--muted);font-size:13px;margin-top:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:200px}
.dnav{display:flex;flex-direction:column;gap:4px}
.mi{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:10px;border-radius:14px}
.mi:hover,.mi.on{background:var(--card)}
.mi .mic{width:38px;height:38px;border-radius:12px;background:var(--card2);display:grid;place-items:center;color:var(--accent);flex:none}
.mi.on .mic{background:var(--accent);color:#fff}
.mi b{display:block;font-size:15px;font-weight:650}
.mi small{display:block;font-size:12.5px;color:var(--muted)}
.drawer .ver{margin-top:auto}
/* Vistas */
.vhead{display:flex;align-items:center;gap:12px;margin:2px 0 14px}
.vhead h2{margin:0;font-size:22px;letter-spacing:-.02em}
.vhead small{color:var(--muted);font-size:13px}
.vhead .icon-btn svg.i{width:20px;height:20px;color:var(--text)}
.search{display:flex;align-items:center;gap:8px;height:46px;border-radius:14px;border:1px solid var(--line);background:var(--card);padding:0 12px;margin-bottom:12px;color:var(--muted)}
.search input{flex:1;min-width:0;border:0;outline:0;background:transparent;font-size:15px}
.resumen{display:flex;justify-content:space-between;align-items:center;padding:14px 16px}
.resumen small{color:var(--muted);font-weight:600}
.resumen{gap:10px}
.resumen .rs{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:2px 12px;font-weight:700;font-size:14.5px}
.resumen .rs span{white-space:nowrap}
.resumen small{white-space:nowrap}

@keyframes subir{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes crecerX{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes crecerY{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes girar{from{opacity:0;transform:rotate(-180deg) scale(.85)}to{opacity:1;transform:rotate(-90deg)}}
.entrada > .card, .entrada > .month, .entrada > .day, .entrada > .list, .entrada .tablero > .card{animation:subir .55s cubic-bezier(.2,.8,.2,1) both}

.entrada > :nth-child(2){animation-delay:.05s} .entrada > :nth-child(3){animation-delay:.12s} .entrada > :nth-child(4){animation-delay:.19s}
.entrada > :nth-child(5){animation-delay:.26s} .entrada > :nth-child(6){animation-delay:.33s} .entrada > :nth-child(n+7){animation-delay:.4s}
.entrada .ratio .bar i{transform-origin:left;animation:crecerX 1.1s .3s cubic-bezier(.2,.8,.2,1) both}
.entrada .cat .tr i{transform-origin:left;animation:crecerX 1s .5s cubic-bezier(.2,.8,.2,1) both}
.entrada .chart .bar{transform-box:fill-box;transform-origin:bottom;animation:crecerY .8s .45s cubic-bezier(.2,.8,.2,1) both}
.entrada .chart .mb:nth-child(n+3) .bar{animation-delay:.5s} .entrada .chart .mb:nth-child(n+5) .bar{animation-delay:.55s} .entrada .chart .mb:nth-child(n+7) .bar{animation-delay:.6s}
@keyframes barrer{from{stroke-dashoffset:289.03}to{stroke-dashoffset:0}}
.entrada .barre{animation:barrer 1.4s .25s cubic-bezier(.45,0,.2,1) both}
.entrada .donut text{animation:subir .6s .5s both}

  --k-track:#26262b; --k-act:#141417; --k-act-bd:rgba(56,189,248,.35); --k-act-tx:#e0f2fe; --k-act-sh:0 8px 24px rgba(0,0,0,.35);

@media (prefers-color-scheme:light){ :root:not([data-theme="dark"]){

  --k-hero-bd:rgba(56,189,248,.35); --k-hero-lbl:#0284c7; --k-h3:#0369a1;

  --k-sheet:linear-gradient(180deg,#ffffff,#f5faff); --k-sheet-bd:rgba(56,189,248,.35); --k-field:#ffffff; --k-seg2:#eef6fc; --k-chip-on-tx:#075985;
  --k-bar:rgba(2,132,199,.18); --k-auth:radial-gradient(90% 50% at 50% 0%,rgba(56,189,248,.30),transparent 70%),radial-gradient(70% 40% at 100% 100%,rgba(37,99,235,.12),transparent 70%),#f2f6fb;

function ico(nombre, extra=''){
  return `<svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" ${extra}>${ICONS[nombre] || ICONS.puntos}</svg>`;
}
/* Ícono y color de cada categoría (por nombre; las que cree cada usuario usan "puntos") */
const CAT_ESTILO = {
  // 12 colores bien distintos entre sí (verificados: ningún par se confunde a simple vista)
  'alquiler':['casa','#2563eb'], 'supermercado':['carrito','#16a34a'], 'comida afuera':['cubiertos','#f97316'],
  'transporte':['colectivo','#06b6d4'], 'servicios':['rayo','#facc15'], 'salud':['salud','#e11d48'], 'salidas':['copa','#f472b6'],
  'ropa':['remera','#a78bfa'], 'educacion':['libro','#a16207'], 'suscripciones':['pantalla','#c026d3'], 'regalos':['regalo','#84cc16'], 'prestamos':['banco','#0d9488'],
  'otros':['puntos','#64748b'],
  'sueldo':['maletin','#2563eb'], 'extra':['sube','#16a34a'], 'ventas':['etiqueta','#f97316'], 'reintegro':['vuelta','#06b6d4'], 'regalo':['regalo','#f472b6'],
};
// Categorías que cree cada usuario: color fijo según el nombre, de la misma paleta
const PALETA_EXTRA = ['#2563eb','#16a34a','#f97316','#06b6d4','#facc15','#e11d48','#f472b6','#a78bfa','#a16207','#c026d3','#84cc16'];
function estiloCat(nombre, iconoGuardado){
  const k = sinAcentos(String(nombre || '')).toLowerCase().trim();
  if (CAT_ESTILO[k]) return {icono: CAT_ESTILO[k][0], color: CAT_ESTILO[k][1]};
  let h = 0; for (const ch of k) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
  return {icono: ICONS[iconoGuardado] ? iconoGuardado : 'puntos', color: PALETA_EXTRA[h % PALETA_EXTRA.length]};
}
/** Si eligió "Otros" y escribió qué es, crea esa categoría (queda para la próxima) */
function catElegida(st, s, p){
  const el = s.querySelector('#' + p + 'CatOtra');
  const txt = st.cat === 'Otros' && el ? el.value : '';
  return (txt.trim() && crearCategoria(st.tipo, txt)) || st.cat || 'Otros';
}
function crearCategoria(tipo, nombre){
  nombre = String(nombre || '').trim().replace(/\s+/g, ' ').slice(0, 40);
  if (!nombre) return null;
  nombre = nombre.charAt(0).toUpperCase() + nombre.slice(1);
  const k = x => sinAcentos(x).toLowerCase();
  const ya = cats().find(c => c.tipo === tipo && k(c.nombre) === k(nombre));
  if (ya) return ya.nombre;
  const l = cats().map(c => ({...c}));
  const item = {tipo, nombre, icono: 'puntos', orden: 50};
  const i = l.findIndex(c => c.tipo === tipo && c.nombre === 'Otros');
  l.splice(i >= 0 ? i : l.length, 0, item);
  D.categorias = l;
  D.queue.push({op: 'cat', item: {id: tipo + ':' + nombre, ...item}});
  return nombre;
}
function catIco(nombre, tipo){
  const c = cats().find(x => x.nombre === nombre && x.tipo === tipo) || cats().find(x => x.nombre === nombre);
  const e = estiloCat(nombre, c && c.icono);
  return {svg: ico(e.icono), color: e.color};
}

const PALETA = ['#7dd3fc','#a78bfa','#f472b6','#fb923c','#facc15','#34d399','#60a5fa','#f87171','#c084fc','#2dd4bf','#fda4af','#94a3b8'];

/* =====================================================================
   Utilidades
   ===================================================================== */
const LS = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} },
  del(k){ try{ localStorage.removeItem(k); }catch(e){} }
};
const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nf = new Intl.NumberFormat('es-AR', {style:'currency', currency:'ARS', minimumFractionDigits:0, maximumFractionDigits:2});
const money = n => nf.format(Math.round((n||0)*100)/100);
const signed = (n, tipo) => (tipo === 'Ingreso' ? '+' : '−') + money(n);
/* ---------- Dólares: cada movimiento puede ser en $ o en US$; los totales se ven en pesos ---------- */
const nfUSD = new Intl.NumberFormat('es-AR', {minimumFractionDigits:0, maximumFractionDigits:2});
const plataUSD = n => 'US$ ' + nfUSD.format(Math.round((n||0)*100)/100);
const DOLAR_TIPOS = [['blue', 'Blue'], ['oficial', 'Oficial'], ['bolsa', 'MEP']];
let DOLAR = LS.get('numa_dolar', null);            // {tipo, venta, compra, fecha}
const tipoDolar = () => LS.get('numa_dolar_tipo', 'blue');
const cotiz = () => (DOLAR && DOLAR.venta) || 0;
const esUSD = m => m && m.moneda === 'USD';
const ars = m => esUSD(m) ? Number(m.monto) * cotiz() : Number(m.monto);
const montoTxt = m => esUSD(m) ? plataUSD(Number(m.monto)) : money(Number(m.monto));
const signedM = m => (m.tipo === 'Ingreso' ? '+' : '−') + montoTxt(m);
/* Dólares: cada usuario los muestra u oculta desde Ajustes (ocultos de entrada) */
let CON_DOLARES = LS.get('numa_dolares', false);
let dolarPedido = 0;
async function actualizarDolar(forzar){
  if (!CON_DOLARES && !(D.movimientos || []).some(esUSD)) return;
  if (!forzar && Date.now() - dolarPedido < 20 * 60 * 1000 && DOLAR && DOLAR.tipo === tipoDolar()) return;
  dolarPedido = Date.now();
  try {
    const t = tipoDolar();
    const r = await fetch('https://dolarapi.com/v1/dolares/' + t, {cache: 'no-store'});
    if (!r.ok) return;
    const j = await r.json();

function parseMonto(v){
  if (typeof v === 'number') return v;
  let s = String(v ?? '').replace(/[^\d.,-]/g, '');
  if (!s) return NaN;
  const coma = s.lastIndexOf(','), punto = s.lastIndexOf('.');
  if (coma >= 0 && punto >= 0) s = coma > punto ? s.replace(/\./g, '').replace(',', '.') : s.replace(/,/g, '');
  else if (coma >= 0) s = /^\d{1,3}(,\d{3})+$/.test(s) ? s.replace(/,/g, '') : s.replace(',', '.');
  else if (punto >= 0 && /^\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g, '');
  return parseFloat(s);
}
const ALIAS = {

const PALABRAS_INGRESO = /\b(cobre|cobro|cobramos|ingreso|ingresaron|ingrese|me pagaron|me pago|me depositaron|me transfirieron|me mandaron|entro|entraron|gane|vendi|sueldo|aguinaldo|reintegro|me devolvieron)\b/;

function interpretarFrase(texto, categorias){
  const s = ' ' + sinAcentos(texto).toLowerCase().replace(/\s+/g, ' ') + ' ';
  const out = {};
  out.tipo = /^\s*\+/.test(texto) || PALABRAS_INGRESO.test(s) ? 'Ingreso' : 'Gasto';

  const re = /(\$\s*)?(\d{1,3}(?:\.\d{3})+(?:,\d{1,2})?|\d+(?:[.,]\d+)?)\s*(k\b|mil\b|lucas?\b|palos?\b|millon(?:es)?\b)?/g;
  let mm, mejor = null;
  while ((mm = re.exec(s)) !== null) {
    let n = parseMonto(mm[2]);
    const mult = mm[3] || '';
    if (/^(k|mil|luca)/.test(mult)) n *= 1000;
    else if (/^(palo|millon)/.test(mult)) n *= 1000000;
    const c = {n, peso: mm[1] ? 1 : 0};
    if (!mejor || c.peso > mejor.peso || (c.peso === mejor.peso && c.n > mejor.n)) mejor = c;
  }
  if (mejor) out.monto = Math.round(mejor.n * 100) / 100;

  out.moneda = CON_DOLARES && /(^|\s)(usd|u\$s|us\$|u\$d|dolar|dolares|dolarcitos|verdes?)(\s|$)/.test(s) ? 'USD' : 'ARS';
  out.medio = /\b(transf\w*|mp|mercado ?pago|banco|debito|tarjeta|cvu|cbu|alias|qr|uala|brubank|naranja x)\b/.test(s) ? 'Transferencia' : 'Efectivo';

  const propias = categorias.filter(c => c.tipo === out.tipo);
  let cat = propias.find(c => s.includes(' ' + sinAcentos(c.nombre).toLowerCase() + ' '));
  if (!cat) {
    const tabla = ALIAS[out.tipo] || {};
    for (const nombre of Object.keys(tabla)) {
      if (!propias.some(c => c.nombre === nombre)) continue;
      if (tabla[nombre].some(a => s.includes(' ' + a + ' ') || s.includes(' ' + a + 's '))) { cat = {nombre}; break; }
    }
  }
  out.categoria = cat ? cat.nombre : 'Otros';
  return out;
}

const mesClave = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
function guardarFijoEnCola(f){
  D.queue = D.queue.filter(o => !(o.op === 'fijo' && o.item.id === f.id));
  D.queue.push({op: 'fijo', item: {...f}});

/** Crea los movimientos de los fijos que ya vencieron y todavía no se cargaron. Devuelve cuántos creó. */
function generarFijos(){
  const hoy = new Date(), actual = mesClave(hoy);
  let creados = 0;
  (D.fijos || []).filter(f => f.activo !== false).forEach(f => {
    const cuotas = Number(f.cuotas) || 0;
    const [y, m] = (f.ultimo_mes || mesClave(new Date(hoy.getFullYear(), hoy.getMonth() - 1, 1))).split('-').map(Number);
    let d = new Date(y, m, 1);                       // el mes siguiente al último cargado
    let cambio = false;
    while (mesClave(d) <= actual) {
      if (cuotas && (f.cuotas_pagadas || 0) >= cuotas) { f.activo = false; cambio = true; break; }
      const dias = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
      const fecha = new Date(d.getFullYear(), d.getMonth(), Math.min(f.dia, dias), 9, 0);
      if (fecha > hoy) break;
      const id = `fijo-${f.id}-${mesClave(d)}`;
      const existe = D.movimientos.some(x => x.id === id) || D.queue.some(o => o.op === 'add' && o.item.id === id);
      const nCuota = (f.cuotas_pagadas || 0) + 1;
      if (!existe) {
        D.queue.push({op: 'add', item: {id, fecha: fecha.toISOString(), tipo: f.tipo, monto: f.monto, categoria: f.categoria,
          medio: f.medio, moneda: f.moneda || 'ARS', nota: cuotas ? `${f.nombre} · cuota ${nCuota} de ${cuotas}` : f.nombre, origen: 'App'}});
        creados++;
      }
      if (cuotas) { f.cuotas_pagadas = nCuota; if (nCuota >= cuotas) f.activo = false; }
      f.ultimo_mes = mesClave(d); cambio = true;
      d = new Date(d.getFullYear(), d.getMonth() + 1, 1);
      if (f.activo === false) break;
    }
    if (cambio) guardarFijoEnCola(f);
  });
  if (creados || D.queue.some(o => o.op === 'fijo')) { if (modo === 'demo') aplicarDemo(); guardar(); }
  return creados;
}

    D.actualizado = new Date().toISOString();
    lastError = null; guardar();
    if (manual) toast(enviados.length ? `✓ ${enviados.length} cambio(s) enviados` : '✓ Todo al día');
  } catch (e) {
    lastError = (e && e.message) || String(e);
    if (/JWT|token|session/i.test(lastError)) { const r = await sb.auth.refreshSession().catch(() => null); if (r && r.error) lastError = 'Volvé a iniciar sesión'; }
    if (manual) toast('No se pudo sincronizar: ' + lastError);
  }
  syncing = false; render();
}

function iniciarTour(paso){
  if (!(modo === 'app' || modo === 'demo') || ui.vista !== 'panel') { tourActivo = false; return; }
  const pasos = pasosTour();
  let i = paso || 0;
  let capa = $('#tour');
  if (!capa) { capa = document.createElement('div'); capa.id = 'tour'; document.body.appendChild(capa); }
  const terminar = () => { LS.set('numa_tour_v1', true); tourActivo = false; capa.remove(); window.removeEventListener('resize', mostrar); };
  function mostrar(){
    const p = pasos[i];
    let el = p.sel ? document.querySelector(p.sel) : null;
    if (el && !el.getClientRects().length) el = null;
    if (el) el.scrollIntoView({block: 'center', behavior: 'instant'});
    const r = el ? el.getBoundingClientRect() : null;
    const pad = 8;
    const hueco = r ? `<div class="tour-hole" style="left:${r.left - pad}px;top:${r.top - pad}px;width:${r.width + pad * 2}px;height:${r.height + pad * 2}px"></div>`
      : '<div class="tour-hole" style="left:50%;top:40%;width:0;height:0;outline:0"></div>';
    const abajo = !r || r.top + r.height / 2 < innerHeight / 2;
    const pos = !r ? 'top:calc(50% - 90px)' : abajo ? `top:${Math.min(innerHeight - 220, r.bottom + pad + 12)}px` : `bottom:${Math.min(innerHeight - 220, innerHeight - r.top + pad + 12)}px`;
    capa.innerHTML = `${hueco}
      <div class="tour-card" style="${pos}" role="dialog" aria-label="${esc(p.t)}">
        <b>${esc(p.t)}</b><p>${esc(p.d)}</p>
        <div class="tour-pie">
          <span class="tour-dots">${pasos.map((_, k) => `<i class="${k === i ? 'on' : ''}"></i>`).join('')}</span>
          ${p.fin ? '' : '<button class="tour-saltar" data-tour="saltar">Saltar</button>'}
          <button class="tour-sig" data-tour="sig">${p.fin ? 'Empezar' : i === 0 ? 'Mostrame' : 'Siguiente'}</button>
        </div>
      </div>`;
  }
  capa.onclick = e => {
    const b = e.target.closest('[data-tour]'); if (!b) return;
    if (b.dataset.tour === 'saltar' || pasos[i].fin) { terminar(); window.scrollTo({top: 0, behavior: 'smooth'}); return; }
    i++; mostrar();
  };
  window.addEventListener('resize', mostrar);
  mostrar();
}

    if (v === 'registro' && pass.length < 8) return err('La contraseña tiene que tener al menos 8 caracteres.');
    if (!navigator.onLine) return err('Necesitás conexión para este paso.');
    btn.disabled = true; msg.textContent = '';
    const volver = location.origin + location.pathname;
    try {
      if (v === 'login') {
        const {error} = await sb.auth.signInWithPassword({email, password: pass});

    if (btn.isConnected) btn.disabled = false;

function traducirError(e){
  const m = (e && e.message) || String(e);
  if (/Invalid login credentials/i.test(m)) return 'Email o contraseña incorrectos.';
  if (/Email not confirmed/i.test(m)) return 'Todavía no confirmaste tu email. Revisá tu bandeja de entrada.';
  if (/already registered|already exists/i.test(m)) return 'Ya existe una cuenta con ese email. Iniciá sesión.';
  if (/Password should be|weak/i.test(m)) return 'Elegí una contraseña más segura (mínimo 8 caracteres).';
  if (/rate limit|too many/i.test(m)) return 'Demasiados intentos. Esperá unos minutos y probá de nuevo.';
  if (/fetch|network/i.test(m)) return 'No hay conexión con el servidor. Probá de nuevo.';
  return m;
}

/* ---------- Gráficos ---------- */
function plataCorta(n){
  const a = Math.abs(n);
  if (a >= 1e6) return '$' + (n / 1e6).toLocaleString('es-AR', {maximumFractionDigits: 1}) + ' M';
  if (a >= 1e3) return '$' + Math.round(n / 1e3).toLocaleString('es-AR') + ' mil';
  return '$' + Math.round(n);
}
/** Barras de gastos de los últimos 6 meses; el mes elegido se resalta y se puede tocar cada barra */
function graficoMensual(todos){
  const hoy = primerDia(new Date()), meses = [];
  for (let i = 5; i >= 0; i--) meses.push(new Date(hoy.getFullYear(), hoy.getMonth() - i, 1));
  const vals = meses.map(m => todos.filter(x => x.tipo === 'Gasto' && mismoMes(new Date(x.fecha), m)).reduce((a, x) => a + ars(x), 0));
  const conDatos = vals.filter(v => v > 0);
  const prom = conDatos.length ? conDatos.reduce((a, b) => a + b, 0) / conDatos.length : 0;
  const max = Math.max(...vals, prom, 1);
  const W = 320, H = 158, top = 24, base = 128, bw = 34, paso = W / 6, rr = 9;
  const y = v => base - (v / max) * (base - top);
  const iSel = meses.findIndex(m => mismoMes(m, ui.mes));
  let barras = '';
  vals.forEach((v, i) => {
    const x = i * paso + (paso - bw) / 2, h = Math.max(v > 0 ? 4 : 0, base - y(v)), sel = i === iSel, r = Math.min(rr, h);
    const mes = meses[i].toLocaleDateString('es-AR', {month: 'short'}).replace('.', '');
    barras += `<g class="mb ${sel ? 'sel' : ''}" data-act="mesir" data-y="${meses[i].getFullYear()}" data-m="${meses[i].getMonth()}" role="button" aria-label="${esc(etiquetaMes(meses[i]))}: ${money(v)}">
      <title>${esc(etiquetaMes(meses[i]))}: ${money(v)}</title>
      <rect x="${i * paso}" y="0" width="${paso}" height="${H}" fill="transparent"/>
      <rect x="${x}" y="${top - 6}" width="${bw}" height="${base - top + 6}" rx="${rr}" class="bg"/>
      ${h ? `<path d="M${x} ${base} V${base - h + r} Q${x} ${base - h} ${x + r} ${base - h} H${x + bw - r} Q${x + bw} ${base - h} ${x + bw} ${base - h + r} V${base} Z" class="bar"/>` : ''}
      ${v ? `<text x="${x + bw / 2}" y="${base - h - 6}" text-anchor="middle" class="vl">${plataCorta(v)}</text>` : ''}
      <text x="${x + bw / 2}" y="${H - 6}" text-anchor="middle" class="ml">${cap(mes)}</text></g>`;
  });
  const linea = prom ? `<line x1="2" x2="${W - 2}" y1="${y(prom)}" y2="${y(prom)}" class="avg"/>` : '';
  const vSel = iSel >= 0 ? vals[iSel] : 0;
  let pill = '';
  if (prom && iSel >= 0 && vSel) {
    const dif = Math.round((vSel - prom) / prom * 100);
    pill = Math.abs(dif) < 3 ? `<span class="mpill">= promedio</span>`
      : `<span class="mpill ${dif > 0 ? 'mas' : 'menos'}">${dif > 0 ? '▲' : '▼'} ${Math.abs(dif)}% vs. promedio</span>`;
  }
  return `<div class="card t-mes"><h3>Últimos meses ${pill}</h3>
    <div class="mbox"><svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Gastos de los últimos 6 meses"><defs><linearGradient id="gBar" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#2563eb"/><stop offset="1" stop-color="#7dd3fc"/></linearGradient></defs>${linea}${barras}</svg>
    ${prom ? `<div class="mleg"><span class="mprom"><i class="lavg"></i>Promedio mensual <b>${plataCorta(prom)}</b></span></div>` : ''}</div></div>`;
}
/** Anillo con la distribución por categoría del mes elegido */
function graficoCategorias(arr, tot){
  if (!arr.length) return '';
  const segs = arr.map(([n, v]) => ({n, v, color: catIco(n, ui.catTipo).color}));
  const r = 46, C = 2 * Math.PI * r, gap = segs.length > 1 ? 2.5 : 0;
  let off = 0, arcs = '';
  segs.forEach(sg => {
    const len = Math.max(0.01, sg.v / tot * C - gap);
    const dim = ui.catSel && ui.catSel !== sg.n ? ' dim' : '';
    arcs += `<circle class="arc${dim}" cx="60" cy="60" r="${r}" stroke="${sg.color}" stroke-dasharray="${len} ${C - len}" stroke-dashoffset="${-off}"
      data-act="catsel" data-n="${esc(sg.n)}"><title>${esc(sg.n)}: ${money(sg.v)} (${Math.round(sg.v / tot * 100)}%)</title></circle>`;
    off += sg.v / tot * C;
  });
  const sel = ui.catSel && segs.find(x => x.n === ui.catSel);
  const centro = sel
    ? `<text x="60" y="55" class="dc1">${esc(sel.n.length > 13 ? sel.n.slice(0, 12) + '…' : sel.n)}</text><text x="60" y="71" class="dc2">${plataCorta(sel.v)}</text><text x="60" y="83" class="dc3">${Math.round(sel.v / tot * 100)}%</text>`
    : `<text x="60" y="66" class="dc2" data-cuenta="${tot}" data-corto="1">${plataCorta(tot)}</text>`;
  // Al costado: las 5 principales y el resto juntas en "Otras"
  const MAXL = 5, resto = segs.slice(MAXL), vResto = resto.reduce((a, b) => a + b.v, 0);
  const fila = (n, v, color, act) => `<button type="button" class="lr${act && ui.catSel && ui.catSel !== n ? ' dim' : ''}" ${act ? `data-act="catsel" data-n="${esc(n)}"` : 'tabindex="-1"'}>
      <i style="background:${color}"></i><span>${esc(n)}</span><b>${Math.round(v / tot * 100)}%</b></button>`;
  const ley = segs.slice(0, MAXL).map(sg => fila(sg.n, sg.v, sg.color, true)).join('')
    + (vResto ? fila(`Otras (${resto.length})`, vResto, '#64748b', false) : '');
  return `<div class="donut dside"><svg viewBox="0 0 120 120" role="img" aria-label="Distribución por categoría"><defs><mask id="dBarre" maskUnits="userSpaceOnUse" x="0" y="0" width="120" height="120">
      <circle cx="60" cy="60" r="${r}" fill="none" stroke="#fff" stroke-width="18" stroke-dasharray="${C.toFixed(2)} ${C.toFixed(2)}" class="barre"/></mask></defs>
    <g transform="rotate(-90 60 60)"><circle cx="60" cy="60" r="${r}" class="track"/><g mask="url(#dBarre)">${arcs}</g></g>${centro}</svg><div class="dley">${ley}</div></div>`;
}


function tarjetaAhorro(){
  const t = totalAhorro(), fs = frascos();
  const detalle = fs.length > 1 || fs.some(f => f.meta);
  const fila = f => {
    const v = saldoFrasco(f.id), p = f.meta ? Math.max(0, Math.min(100, v / f.meta * 100)) : 0;
    return `<div class="fr"><span class="n">${esc(f.nombre)}</span>${f.meta ? `<div class="bar"><i style="width:${p.toFixed(1)}%"></i></div>` : '<span class="sp"></span>'}<b class="num">${money(v)}</b></div>`;
  };
  return `<div class="card t-aho" data-act="ahover">
    <div class="r"><span class="ic">${ico('alcancia')}</span>

/* ---------- Movimiento al abrir: los números cuentan y los gráficos crecen ---------- */
function animarPanel(){
  if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const main = $('#main');
  main.classList.add('entrada');
  animHasta = Date.now() + 1800;
  setTimeout(() => main.classList.remove("entrada"), 1900);
  const dur = 1100, t0 = performance.now(), ease = t => 1 - Math.pow(1 - t, 3);
  const els = [...main.querySelectorAll('[data-cuenta]')].map(el => ({el, fin: Number(el.dataset.cuenta), corto: !!el.dataset.corto, pct: !!el.dataset.pct}));
  const pintar = (o, v) => { o.el.textContent = o.pct ? String(v) : o.corto ? plataCorta(v) : (v < 0 ? '−' : '') + money(Math.abs(v)); };
  els.forEach(o => pintar(o, 0));
  const paso = now => {
    const k = ease(Math.min(1, (now - t0) / dur));
    els.forEach(o => pintar(o, Math.round(o.fin * k)));
    if (k < 1) requestAnimationFrame(paso); else els.forEach(o => pintar(o, o.fin));
  };
  requestAnimationFrame(paso);
}

function renderPanel(){
  // si la entrada animada está en curso, se espera a que termine para no cortarla
  if (Date.now() < animHasta) { clearTimeout(renderPend); renderPend = setTimeout(render, animHasta - Date.now() + 20); return; }
  const todos = movimientos();
  const delMes = todos.filter(m => mismoMes(new Date(m.fecha), ui.mes));

  const porCat = {};
  delMes.filter(m => m.tipo === ui.catTipo).forEach(m => porCat[m.categoria] = (porCat[m.categoria] || 0) + ars(m));
  const arr = Object.entries(porCat).sort((a, b) => b[1] - a[1]);

function temaActual(){ try { return localStorage.getItem('numa_tema') || 'auto'; } catch(e) { return 'auto'; } }
function aplicarTema(t){
  try { localStorage.setItem('numa_tema', t); } catch(e) {}
  const r = document.documentElement;
  if (t === 'light' || t === 'dark') r.setAttribute('data-theme', t); else r.removeAttribute('data-theme');
  const oscuro = t === 'dark' || (t === 'auto' && !(window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches));
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute('content', oscuro ? '#000000' : '#f2f6fb');
  const ic = document.querySelector('link[rel="apple-touch-icon"]'); if (ic) ic.setAttribute('href', oscuro ? 'apple-touch-icon.png' : 'apple-touch-icon-claro.png');
}

  inp.addEventListener('input', () => { ui.movBusca = inp.value; pintarListaMovs(); });

}
function pintarListaMovs(){
  const q = sinAcentos(ui.movBusca.trim().toLowerCase());
  const f = ui.movFiltro;
  const movs = f === 'Ahorro' ? [] : movimientos().filter(m =>
    (f === 'Todos' || (f === 'Ingresos' ? m.tipo === 'Ingreso' : m.tipo === 'Gasto')) &&
    (!q || sinAcentos(`${m.nota} ${m.categoria} ${m.medio}`.toLowerCase()).includes(q)));
  const ahs = (f === 'Todos' || f === 'Ahorro') ? ahorros().map(a => ({...a, kind: 'aho'})).filter(a =>
    !q || sinAcentos(`ahorro ${a.nota} ${frascoPorId(a.frasco || 'general')?.nombre || ''} ${a.medio}`.toLowerCase()).includes(q)) : [];
  const lista = movs.concat(ahs).sort((a, b) => new Date(b.fecha) - new Date(a.fecha));
  let ing = 0, gas = 0, aho = 0;
  movs.forEach(m => m.tipo === 'Ingreso' ? ing += ars(m) : gas += ars(m));
  ahs.forEach(a => aho += (a.tipo === 'Guardar' ? 1 : -1) * Number(a.monto));
  const grupos = [];
  lista.forEach(m => {
    const d = new Date(m.fecha), k = mesClave(d);
    let g = grupos[grupos.length - 1];
    if (!g || g.k !== k) { g = {k, d, items: [], neto: 0}; grupos.push(g); }
    g.items.push(m); if (m.kind !== 'aho') g.neto += (m.tipo === 'Ingreso' ? 1 : -1) * ars(m);
  });
  $('#mLista').innerHTML = `
    <div class="card resumen"><div><small>${lista.length} movimiento${lista.length === 1 ? '' : 's'}</small></div>
      <div class="rs">${f === 'Todos' || f === 'Ingresos' ? `<span class="pos num">+${money(ing)}</span>` : ''}${f === 'Todos' || f === 'Gastos' ? `<span class="neg num">−${money(gas)}</span>` : ''}${ahs.length ? `<span class="num aho">${aho < 0 ? '−' : ''}${money(Math.abs(aho))}</span>` : ''}</div></div>
    ${grupos.length ? grupos.map(g => `
      <div class="day"><span>${esc(etiquetaMes(g.d))}</span><span class="num">${g.neto >= 0 ? '+' : '−'}${money(Math.abs(g.neto))}</span></div>
      <div class="list">${g.items.map(m => filaX(m, true)).join('')}</div>`).join('')
    : `<div class="card empty">${q ? 'No hay movimientos que coincidan con la búsqueda.' : 'Todavía no hay movimientos.'}</div>`}`;
}

  const todos = (D.fijos || []).slice().sort((a, b) => a.dia - b.dia);

  const pagados = todos.filter(f => f.activo === false && Number(f.cuotas) > 0);
  const ing = fijos.filter(f => f.tipo === 'Ingreso'), gas = fijos.filter(f => f.tipo === 'Gasto' && !Number(f.cuotas));
  const pres = fijos.filter(f => f.tipo === 'Gasto' && Number(f.cuotas) > 0);
  const tP = pres.reduce((a, f) => a + ars(f), 0);
  const deuda = pres.reduce((a, f) => a + ars(f) * (Number(f.cuotas) - (f.cuotas_pagadas || 0)), 0);
  const tI = ing.reduce((a, f) => a + ars(f), 0), tG = gas.reduce((a, f) => a + ars(f), 0) + tP;

    const ci = catIco(f.categoria, f.tipo);

  };
  $('#main').innerHTML = `
    ${encabezadoVista('Fijos', 'Se cargan solos cada mes, el día que elijas')}

      <div class="lbl">Te queda libre por mes</div>

      </div>

    ${ing.length ? `<div class="list">${ing.map(fila).join('')}</div>` : `<div class="card empty">Agregá tu sueldo u otros ingresos que cobres todos los meses.</div>`}
    <div class="day"><span>Gastos fijos</span><span class="num">${money(tG - tP)}</span></div>
    ${gas.length ? `<div class="list">${gas.map(fila).join('')}</div>` : `<div class="card empty">Agregá alquiler, servicios o suscripciones.</div>`}
    <div class="day"><span>Préstamos y cuotas</span><span class="num">${pres.length ? 'debés ' + money(deuda) : ''}</span></div>
    ${pres.length || pagados.length ? `<div class="list">${pres.concat(pagados).map(filaPrestamo).join('')}</div>` :

}

function campoMonto(input, hint){
  const ancho = () => { input.style.width = Math.max(1, (input.value || '0').length * 0.62 + 0.3) + 'em'; };
  input.addEventListener('input', e => {
    let v = input.value;
    if (e.data === '.' && !v.includes(',')) v = v.replace(/\.(?=[^.]*$)/, ',');
    v = v.replace(/[^\d,]/g, '');
    const i = v.indexOf(',');
    let ent = i >= 0 ? v.slice(0, i) : v;
    const dec = i >= 0 ? v.slice(i + 1).replace(/,/g, '').slice(0, 2) : null;
    ent = ent.replace(/^0+(?=\d)/, '').replace(/\B(?=(\d{3})+(?!\d))/g, '.');
    input.value = dec !== null ? (ent || '0') + ',' + dec : ent;
    if (hint) hint.dataset.err = ''; ancho();
  });
  input.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); input.blur(); } });
  ancho();
  return () => parseFloat((input.value || '').replace(/\./g, '').replace(',', '.'));
}

/** Abre el atajo pasándole la clave: el atajo la guarda y queda conectado (sirve para todos los atajos de Numa). */
/* Prueba gratis de los atajos: 14 días desde el registro (el servidor controla lo mismo en numa_anotar) */
const PRUEBA_DIAS = 14, PRECIO_PREMIUM = 2500;
function estadoPlan(){
  const p = D.perfil || {};
  if (p.plan === 'premium') return {premium: true, dias: 0};
  const ini = p.creado ? new Date(p.creado).getTime() : Date.now();
  return {premium: false, dias: Math.max(0, Math.ceil((ini + PRUEBA_DIAS * 864e5 - Date.now()) / 864e5))};
}
function conectarAtajos(nombre){
  const k = D.perfil?.clave_atajo;
  if (!k) { toast('Sincronizá primero para conectar los atajos'); return; }
  location.href = 'shortcuts://run-shortcut?name=' + encodeURIComponent(nombre) + '&input=text&text=' + encodeURIComponent(k);
}

  else if (a === 'ajustes') { cerrarMenu(); abrirAjustes(); }
  else if (a === 'menu') abrirMenu();
  else if (a === 'verguia') { cerrarSheet(); cerrarMenu && cerrarMenu(); ui.vista = 'panel'; LS.set('numa_tour_v1', false); tourActivo = false; render(); }
  else if (a === 'dolares') { CON_DOLARES = b.dataset.v === '1'; LS.set('numa_dolares', CON_DOLARES); if (CON_DOLARES) actualizarDolar(true).then(() => abrirAjustes()); abrirAjustes(); render(); }
  else if (a === 'dolartipo') { LS.set('numa_dolar_tipo', b.dataset.t); DOLAR = null; actualizarDolar(true).then(() => abrirAjustes()); abrirAjustes(); }
  else if (a === 'tema') { aplicarTema(b.dataset.t); abrirAjustes(); }
  else if (a === 'cerrarmenu') cerrarMenu();
  else if (a === 'vista') { if (b.dataset.v === 'panel' && ui.vista !== 'panel') animarEntrada = true; ui.vista = b.dataset.v; cerrarMenu(); window.scrollTo(0, 0); render(); }
  else if (a === 'movfiltro') { ui.movFiltro = b.dataset.f; render(); }
  else if (a === 'fijonuevo') abrirFormFijo();
  else if (a === 'prestamonuevo') abrirFormFijo({prestamo: true, tipo: 'Gasto'});
  else if (a === 'fijover') { const f = (D.fijos || []).find(x => x.id === b.dataset.id); if (f) abrirFormFijo(f); }
  else if (a === 'cerrar') cerrarSheet();
  else if (a === 'sync') { if (modo === 'demo') abrirAjustes(); else sincronizar(true); }
  else if (a === 'mes') { ui.mes = new Date(ui.mes.getFullYear(), ui.mes.getMonth() + Number(b.dataset.d), 1); ui.catSel = null; render(); }
  else if (a === 'cattipo') { ui.catTipo = b.dataset.t; ui.catSel = null; render(); }
  else if (a === 'catver') { ui.catAbierta = !ui.catAbierta; render(); }
  else if (a === 'catsel') { ui.catSel = ui.catSel === b.dataset.n ? null : b.dataset.n; render(); }
  else if (a === 'mesir') { ui.mes = new Date(Number(b.dataset.y), Number(b.dataset.m), 1); ui.catSel = null; render(); }
  else if (a === 'authvista') { authVista = b.dataset.v; render(); }
  else if (a === 'demo') iniciarDemo();
  else if (a === 'salirdemo') { LS.del('numa_demo'); salirDemo(); authVista = 'registro'; render(); }
  else if (a === 'salir') { cerrarSheet(); sb.auth.signOut(); }
  else if (a === 'atajo') instalarAtajo(b.dataset.f);
  else if (a === 'atajogo') descargarAtajo(b.dataset.f);
  else if (a === 'conectar') conectarAtajos(b.dataset.n);
  else if (a === 'ahonuevo') abrirAhorroForm(b.dataset.t, b.dataset.f);
  else if (a === 'frver') abrirFrasco(b.dataset.f);
  else if (a === 'frnuevo') abrirFrascoEdit();
  else if (a === 'ahover') abrirAhorro();
  else if (a === 'premium') toast('Muy pronto vas a poder pagar con Mercado Pago');
  else if (a === 'copiarclave') { const k = D.perfil?.clave_atajo; if (k) copiar(k).then(ok => toast(ok ? '✓ Clave copiada' : 'No se pudo copiar')); }
  else if (a === 'revborrar') { D.revisar = D.revisar.filter(r => r.id !== b.dataset.id); guardar(); render(); }
  else if (a === 'revcargar') { const r = D.revisar.find(x => x.id === b.dataset.id); if (r) abrirForm('Gasto', {id: r.id, nota: r.texto, fecha: r.fecha, ...interpretarFrase(r.texto, cats())}); }
});

window.addEventListener('online',  () => { renderEstado(); sincronizar(); });
window.addEventListener('offline', () => { if (modo === 'app' || modo === 'demo') renderEstado(); });
/* Teclado del iPhone: el panel de carga se acomoda arriba del teclado y el campo enfocado queda a la vista */
function ajustarSheetTeclado(){
  const vv = window.visualViewport, sh = $('#sheet');
  if (!vv || !sh || innerWidth >= 760) { if (sh) { sh.style.bottom = ''; sh.style.maxHeight = ''; } return; }
  const kb = Math.max(0, Math.round(innerHeight - vv.height - vv.offsetTop));
  sh.style.bottom = kb + 'px';
  sh.style.maxHeight = Math.round(vv.height * (kb ? 0.97 : 0.94)) + 'px';
}
if (window.visualViewport) { visualViewport.addEventListener('resize', ajustarSheetTeclado); visualViewport.addEventListener('scroll', ajustarSheetTeclado); }
document.addEventListener('focusin', e => {
  const el = e.target, sh = $('#sheet');
  if (!sh || !sh.contains(el) || !el.matches('input, textarea')) return;
  const ver = () => {
    ajustarSheetTeclado();
    if (el.closest('.amount')) sh.scrollTop = 0;       // el monto está arriba de todo
    else el.scrollIntoView({block: 'nearest'});
    if (window.visualViewport && visualViewport.offsetTop) window.scrollTo(0, window.scrollY); // evita que Safari corra la página
  };
  ver(); setTimeout(ver, 120); setTimeout(ver, 350);
});

// Cada vez que se vuelve a abrir la app (aunque estuviera en segundo plano), el inicio se anima de nuevo
let ocultaDesde = 0;
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') { ocultaDesde = Date.now(); return; }
  if (ocultaDesde && Date.now() - ocultaDesde > 1500 && (modo === 'app' || modo === 'demo')) {
    if (ui.vista === 'panel' && !document.body.classList.contains('sheet-open') && !tourActivo) {
      window.scrollTo(0, 0); animarEntrada = true; animHasta = 0; render();
    }
  }
  ocultaDesde = 0;
  sincronizar(); actualizarDolar();
});
actualizarDolar();
setInterval(() => { if (D.queue.length && navigator.onLine) sincronizar(); }, 20000);

function abrirNuevaContrasena(){
  const s = abrirSheet(`
    <h2>Nueva contraseña</h2>
    <form id="nForm"><input class="field" id="nPass" type="password" autocomplete="new-password" placeholder="Mínimo 8 caracteres">
    <button class="primary" type="submit">Guardar contraseña</button></form><div class="msg" id="nMsg"></div>`);
  $('#nForm', s).onsubmit = async ev => {
    ev.preventDefault();
    const pass = $('#nPass', s).value;
    if (pass.length < 8) { $('#nMsg', s).innerHTML = '<span class="neg">Mínimo 8 caracteres.</span>'; return; }
    const {error} = await sb.auth.updateUser({password: pass});
    if (error) { $('#nMsg', s).innerHTML = `<span class="neg">${esc(traducirError(error))}</span>`; return; }
    cerrarSheet(); toast('✓ Contraseña actualizada');
  };
}

/* =====================================================================
   Inicio
   ===================================================================== */
async function iniciar(){
  if (LS.get('numa_modo', '') === 'demo') return iniciarDemo();
  if (!sb) { modo = 'sinconfig'; return render(); }

  sb.auth.onAuthStateChange((evento, sesion) => {
    if (evento === 'PASSWORD_RECOVERY') { setTimeout(abrirNuevaContrasena, 300); }
    const u = sesion?.user || null;
    if (u && (!user || user.id !== u.id)) {
      user = {id: u.id, email: u.email}; modo = 'app'; cargarLocal(); render(); sincronizar();
    } else if (!u && user) {
      user = null; D = vacio(); modo = 'auth'; authVista = 'login'; render();
    }
  });

  const {data} = await sb.auth.getSession();
  const u = data?.session?.user;
  if (u) { user = {id: u.id, email: u.email}; modo = 'app'; cargarLocal(); generarFijos(); render(); sincronizar(); }
  else if (modo === 'cargando') { modo = 'auth'; render(); }
}
iniciar();

if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
</script>
